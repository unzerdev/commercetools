# Response security headers applied on every TLS server (HSTS only makes sense over TLS). Frame
# protection is set PER server block: the processor/enabler deny framing outright, while mc/mc-view
# must be frameable by the Merchant Center, so their blocks set no framing header at all — who may
# frame them is decided by the CSP the Merchant Center itself emits, not by this edge or by the apps'
# own `headers.csp`, which declares `connect-src` alone.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
