name: Bump Version and Create PR

on:
  workflow_dispatch:
    inputs:
      BUMP_TYPE:
        description: "Select the bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 26.x
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - name: Bump every manifest
        run: |
          npm version --no-git-tag-version ${{ inputs.BUMP_TYPE }}
          VERSION=$(node -p "require('./package.json').version")

          for APP in processor enabler mc mc-view e2e; do
            npm ci --prefix "$APP"
            npm version --prefix "$APP" --no-git-tag-version "$VERSION"
          done

      - name: Commit changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'chore: bump version'

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump version"
          branch: "bump-version-branch"
          title: "Bump version"
          body: "This PR bumps the version. This is executed by a GitHub Action `bump.yaml`."
          labels: "version bump"
          sign-commits: true
